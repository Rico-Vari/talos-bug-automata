name: Feature request
description: Propose a new capability or a change in behavior
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that Talos makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you imagine it working. Config keys, Telegram commands, pipeline changes…
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
